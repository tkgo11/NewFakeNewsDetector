name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.10"
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pytest
      - run: node --check extension/background.js && node --check src/newfakenewsdetector/web/app.js
      - run: uv build
